apiVersion: v1
kind: PersistentVolume
metadata:
  name: nfs-pv-a
spec:
  capacity:
    storage: 50Gi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  nfs:
    server: 10.192.36.9
    path: /mnt/pvc/influxdb
---
